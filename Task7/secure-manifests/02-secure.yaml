apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-volume
  namespace: audit-zone
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: config-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: config-volume
      configMap:
        name: nginx-config